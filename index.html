<style>
:root{--red:#e2231a;--dred:#a8140d;--ink:#1b1b1b;--card:#fff;--soft:#eee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
button{font:inherit;cursor:pointer}

/* loading */
#load{display:flex;background:var(--red);color:#fff;gap:22px}
.logo{position:relative;width:110px;height:110px;background:#fff;color:var(--red);font-size:76px;line-height:110px;text-align:center;transform:rotate(-12deg);border-radius:6px;box-shadow:6px 6px 0 var(--dred)}

.logo i:nth-child(1){left:16px}.logo i:nth-child(2){right:16px}
#load h1{margin:0;font-size:clamp(34px,10vw,60px);letter-spacing:1px}
.barw{width:min(78vw,380px);height:20px;border:3px solid #fff;border-radius:4px;padding:2px;box-sizing:border-box}
#bar{height:100%;width:0;background:#fff;transition:width .15s}
#tip{margin:0;font-family:Arial,sans-serif;font-weight:700;font-size:15px;text-align:center;padding:0 24px;min-height:20px}
/* menu */
#menu{background:var(--red);padding:0 0 16px;box-sizing:border-box;justify-content:flex-start;gap:16px;overflow:auto}
.card{background:var(--card);border-radius:8px;width:min(94vw,420px);max-height:96%;overflow:auto;box-shadow:0 6px 0 var(--dred)}

.body{padding:14px 16px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-family:Arial,sans-serif}

.hd{left:48px;top:8px;width:44px;height:44px;background:var(--h);border-radius:6px}
.hd:before{content:"";position:absolute;left:9px;top:14px;width:5px;height:5px;background:#222;border-radius:50%;box-shadow:16px 0 #222}
.hd:after{content:"";position:absolute;left:11px;top:25px;width:18px;height:7px;border-bottom:3px solid #222;border-radius:0 0 18px 18px}
.tr{left:36px;top:54px;width:68px;height:62px;background:var(--t)}
.al{left:12px;top:54px;width:22px;height:62px;background:var(--h)}.ar{left:106px;top:54px;width:22px;height:62px;background:var(--h)}
.ll{left:36px;top:118px;width:34px;height:64px;background:var(--l)}.lr{left:70px;top:118px;width:34px;height:64px;background:var(--l)}
#opts{flex:1;min-width:170px;display:flex;flex-direction:column;gap:8px}
.row b{display:block;font-size:13px;margin-bottom:4px}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border:2px solid rgba(0,0,0,.4);border-radius:4px;padding:0}
.sw button.on{outline:3px solid var(--ink);outline-offset:1px}
#nm{width:100%;box-sizing:border-box;font:700 16px Arial,sans-serif;padding:8px;border:2px solid var(--soft);border-radius:4px;background:var(--card);color:var(--ink)}
.big{display:block;width:calc(100% - 32px);margin:4px 16px 16px;padding:14px;background:var(--red);color:#fff;border:0;border-bottom:5px solid var(--dred);border-radius:6px;font-size:22px}
.big:active{transform:translateY(3px);border-bottom-width:2px}
/* game */
#game{justify-content:flex-start;align-items:stretch}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);padding:8px 12px;background:rgba(255,255,255,.92);color:#1b1b1b;border:3px solid var(--red);border-radius:6px;font-size:15px}
#coins{right:10px}
#mb{left:10px;cursor:pointer}
#help{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);text-align:center;color:#fff;font:700 13px Arial,sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}
#joy{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:var(--red);border:3px solid #fff;pointer-events:none}
#jump{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;background:var(--red);color:#fff;border:4px solid #fff;font-size:16px;touch-action:none}
#win{position:absolute;inset:0;background:rgba(226,35,26,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:20px}
#win h2{margin:0;font-size:30px}#win p{margin:0;font:700 16px Arial,sans-serif}
#win button{padding:12px 22px;font-size:18px;border:0;border-bottom:5px solid #bbb;border-radius:6px;background:#fff;color:var(--red)}
.top{width:100%;background:var(--dred);display:flex;align-items:center;gap:6px;padding:8px 12px;box-sizing:border-box;color:#fff}
.top strong{font-size:20px;margin-right:auto}
.top button{background:transparent;color:#fff;border:0;padding:8px 14px;border-radius:4px;font-size:15px}
.top button.on{background:#fff;color:var(--red)}
.tile{width:150px;flex:none;text-align:center;font-family:Arial,sans-serif;font-weight:700;font-size:13px}
.tile div{height:110px;margin-bottom:6px;background:var(--red);color:#fff;font:700 40px/104px "Arial Black",Arial,sans-serif;border-radius:6px;border:3px solid var(--dred)}
.hi{flex:1;min-width:150px;font-size:15px;line-height:1.4}
.hi h3{margin:0 0 6px;font:700 20px "Arial Black",Arial,sans-serif}
#pause{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
.plist{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;font-family:Arial,sans-serif;font-weight:700}
.plist button{padding:12px;background:var(--soft);color:var(--ink);border:0;border-bottom:4px solid rgba(0,0,0,.25);border-radius:6px;font-size:16px}
.plist button#pl{background:var(--red);color:#fff;border-bottom-color:var(--dred)}
.plist label{display:flex;flex-direction:column;gap:6px;font-size:14px}
#tm{left:50%;transform:translateX(-50%)}
.ht{display:none}
#av[data-hat="1"] .ht{display:block;left:44px;top:2px;width:52px;height:14px;background:#e2231a;z-index:2}
#av[data-hat="2"] .ht{display:block;left:48px;top:-14px;width:44px;height:24px;background:#222;z-index:2}
#av[data-hat="3"] .ht{display:block;left:46px;top:0;width:48px;height:14px;background:#ffcf1f;z-index:2}
.sw button.tx{width:auto;padding:0 9px;background:var(--soft);color:var(--ink);font:700 12px Arial,sans-serif}
#menu{background:var(--soft)}
#tab-home{width:min(96vw,720px)}
.prof{display:flex;gap:14px;align-items:center;padding:14px 16px;font-family:Arial,sans-serif;font-size:14px}
.prof h3{margin:0 0 4px;font:700 20px "Arial Black",Arial,sans-serif}
.pav{width:60px;height:60px;flex:none;border:3px solid rgba(0,0,0,.45);border-radius:6px;background:#f5cd30;font:700 22px/54px Arial,sans-serif;text-align:center;color:#222}
.sec{padding:8px 16px;background:var(--soft);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:14px 16px 16px}
.gc{display:flex;flex-direction:column;gap:3px;text-align:left;padding:0 0 8px;background:var(--card);color:var(--ink);border:2px solid var(--soft);border-radius:4px;font-family:Arial,sans-serif;font-size:12px;overflow:hidden}
.gc .th{height:92px;background:var(--red);color:#fff;font:700 38px/92px "Arial Black",Arial,sans-serif;text-align:center}
.gc b{padding:4px 8px 0;font-size:14px}.gc span{padding:0 8px;opacity:.75}
.gc:not(.off):hover{border-color:var(--red)}
.gc.off{opacity:.55;cursor:default}.gc.off .th{background:#8a8a8a}
#menu{padding:calc(62px + env(safe-area-inset-top,0px)) 0 84px}
.wrap{width:min(96vw,720px)}
.top{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);padding:0 0 env(safe-area-inset-bottom,0px);gap:0;border-top:1px solid var(--soft)}
.top strong{position:fixed;top:0;left:0;right:0;margin:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 14px;background:var(--red);color:#fff;text-align:center;font-size:20px}
.top button,.top button.on{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:#8a8a8a;padding:8px 0;font-size:22px;border-radius:0}
.top button.on{color:var(--red)}
.top small{font:700 11px Arial,sans-serif}
.prof{background:var(--card);padding:18px 16px}
.prof h3{margin:0 0 2px;font:300 34px "Segoe UI",Arial,sans-serif}
.pav{width:72px;height:72px;border-radius:50%;line-height:66px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:transparent;font:300 22px Arial,sans-serif}
.all{background:var(--red);color:#fff;border:0;border-radius:4px;padding:8px 18px;font:700 14px Arial,sans-serif}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:12px 16px 18px;background:var(--card)}
.hrow .gc{flex:none;width:150px}
.top strong{text-align:left;padding-left:16px;padding-right:16px;line-height:1.15}
#ttl small{display:block;font:400 12px Arial,sans-serif;opacity:.9}
.fri{display:flex;gap:18px;overflow-x:auto;padding:16px;background:var(--card);font:14px Arial,sans-serif}
.fr{flex:none;width:84px;text-align:center;position:relative}
.fr:after{content:"";position:absolute;right:2px;top:62px;width:16px;height:16px;border-radius:50%;background:#1db954;border:2px solid var(--card)}
.fc{position:relative;width:84px;height:84px;border-radius:50%;background:var(--soft);overflow:hidden;margin-bottom:6px}
.fc i{position:absolute;left:30px;top:16px;width:24px;height:24px;border-radius:3px}
.fc u{position:absolute;left:22px;top:44px;width:40px;height:40px}
.gc{cursor:pointer}.gc .th{position:relative}
.fv{position:absolute;top:4px;right:4px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#ffd400;font-size:16px;line-height:30px}
.hint{display:block;padding:10px 4px;font:14px Arial,sans-serif;opacity:.7}
.pf{text-align:center;font:14px Arial,sans-serif}.pf .pav{margin:0 auto 8px;width:110px;height:110px;line-height:100px;font-size:36px}
.stats{display:flex;justify-content:space-around;margin:12px 0;opacity:.9}
.stats b{display:block;color:var(--red);font:300 24px Arial,sans-serif}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}

/* Joyblox classic-inspired red and white interface */
:root{--red:#c91f2c;--dred:#a81722;--ink:#242424;--card:#fff;--soft:#f0f0f0}
html,body{background:#fff;color:#242424}
#menu{background:#fff;padding:calc(72px + env(safe-area-inset-top,0px)) 0 calc(78px + env(safe-area-inset-bottom,0px));gap:0;overflow-y:auto;align-items:stretch}
#headbar{position:fixed;z-index:7;top:0;left:0;right:0;height:calc(66px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;box-shadow:0 2px 4px rgba(0,0,0,.16)}
.headtitle{display:flex;flex-direction:column;gap:2px;min-width:0}

.headtitle small{font:14px Arial,sans-serif;opacity:.9}
.headtools{display:flex;align-items:center;gap:8px}
.headtools button{width:44px;height:44px;border:0;background:transparent;color:#fff;font:32px Arial,sans-serif;padding:0}
#robuxbtn{font-size:20px;font-weight:700;border:3px solid #fff;border-radius:50%;width:38px;height:38px}
#menubtn{font-size:30px}
.top{position:fixed;z-index:8;top:auto;bottom:0;left:0;right:0;height:calc(68px + env(safe-area-inset-bottom,0px));padding:4px 0 env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid #d7d7d7;box-shadow:0 -2px 6px rgba(0,0,0,.08);display:flex;align-items:center}
.top button,.top button.on{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;color:#929292;padding:4px 0;font:28px Arial,sans-serif;border:0;border-radius:0}
.top button.on{color:var(--red)}

.wrap{width:100%;max-width:760px;margin:0 auto}
#tab-home{padding-bottom:8px}
.sec{background:#fff;padding:16px 16px 8px;font:300 22px "Segoe UI",Arial,sans-serif;color:#242424}
.all{background:#079be8;color:#fff;border:0;border-radius:5px;padding:9px 18px;font:16px Arial,sans-serif;min-width:112px}

.fri{min-height:118px;align-items:flex-start}
.fr{width:94px;font-size:14px}
.fc{width:84px;height:84px;border-radius:50%;border:2px solid #eee;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.hrow{gap:12px;padding:10px 16px 18px}

.grid .gc{box-shadow:0 2px 5px rgba(0,0,0,.1)}
.prof{background:#fff}

/* Tela de cadastro inspirada no Roblox de 2016 */
#signup{display:none;background:#fff;justify-content:flex-start;overflow-y:auto;color:#333;font-family:Arial,sans-serif}
.signup-head{width:100%;background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 16px;box-sizing:border-box;box-shadow:0 2px 5px #0002}
.signup-brand{font:900 30px "Arial Black",Arial,sans-serif;letter-spacing:-1px}
.signup-brand span{display:inline-block;background:#fff;color:var(--red);padding:1px 7px;margin-right:5px;transform:rotate(-8deg)}
.signup-sub{font-size:13px;margin-top:4px;opacity:.95}
.signup-panel{width:min(92vw,430px);margin:24px auto;padding:0 0 24px;background:#fff}
.signup-panel h1{font:300 28px "Segoe UI",Arial,sans-serif;color:#444;margin:0 0 5px}
.signup-panel .lead{font:14px Arial,sans-serif;color:#777;margin:0 0 18px}
.sg-label{display:block;font:700 13px Arial,sans-serif;color:#555;margin:13px 0 6px}
.sg-input,.sg-select{width:100%;height:43px;box-sizing:border-box;border:1px solid #bbb;border-radius:3px;background:#fff;color:#333;padding:0 11px;font:16px Arial,sans-serif;box-shadow:inset 0 1px 2px #0000000c}
.sg-input:focus,.sg-select:focus{border-color:#777;outline:2px solid #d9eaff}
.sg-dates{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:7px}
.sg-gender{display:flex;gap:10px}

.sg-gender input{accent-color:var(--red);margin-right:5px}
.sg-submit{width:100%;margin-top:19px;background:var(--red);color:#fff;border:0;border-bottom:4px solid var(--dred);border-radius:4px;padding:13px;font:700 18px Arial,sans-serif}
.sg-submit:active{transform:translateY(2px);border-bottom-width:2px}
.sg-login{text-align:center;font-size:14px;color:#666;margin-top:17px}
.sg-login button{border:0;background:none;color:#0786c9;font-weight:700;font-size:14px}
.sg-legal{font:11px/1.45 Arial,sans-serif;color:#888;margin-top:16px}

@media(max-height:700px){.signup-head{padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px}.signup-panel{margin-top:15px}.sg-label{margin-top:9px}}

/* Multiplayer: chat e contador */
input{-webkit-user-select:text;user-select:text}
#chatbtn{top:calc(env(safe-area-inset-top,0px) + 56px);right:10px;cursor:pointer;font-size:14px;padding:6px 10px;z-index:3}
#chatbox{position:absolute;left:10px;right:112px;top:calc(env(safe-area-inset-top,0px) + 56px);display:none;z-index:3}

body.chat-open #chatlog .old{display:block}

<body>
<section id="load" class="scr">
  <div class="logo"><i></i><i></i>J</div>
  <h1>Joyblox</h1>
  <div class="barw"><div id="bar"></div></div>
  <p id="tip">Carregando blocos...</p>
</section>

<section id="signup" class="scr">
  <header class="signup-head"><div class="signup-brand"><span>J</span>JOYBLOX</div><div class="signup-sub">Jogue, crie e divirta-se com seus amigos!</div></header>
  <div class="signup-panel">
    <h1>Crie sua conta</h1>
    <p class="lead">Cadastre-se para começar sua aventura.</p>
    <form id="signupform">
      <label class="sg-label" for="birthmonth">Data de nascimento</label>
      <div class="sg-dates">
        <select class="sg-select" id="birthmonth" required><option value="">Mês</option><option>Janeiro</option><option>Fevereiro</option><option>Março</option><option>Abril</option><option>Maio</option><option>Junho</option><option>Julho</option><option>Agosto</option><option>Setembro</option><option>Outubro</option><option>Novembro</option><option>Dezembro</option></select>
        <select class="sg-select" id="birthday" required><option value="">Dia</option></select>
        <select class="sg-select" id="birthyear" required><option value="">Ano</option></select>
      </div>
      <label class="sg-label" for="newuser">Nome de usuário</label>
      <input class="sg-input" id="newuser" maxlength="16" minlength="3" autocomplete="username" placeholder="Não use seu nome completo" required>
      <label class="sg-label" for="newpass">Senha</label>
      <input class="sg-input" id="newpass" type="password" minlength="6" autocomplete="new-password" placeholder="Crie uma senha" required>
      <label class="sg-label">Gênero (opcional)</label>
      <div class="sg-gender"><label><input type="radio" name="gender" value="Feminino"> Feminino</label><label><input type="radio" name="gender" value="Masculino"> Masculino</label></div>
      <button class="sg-submit" type="submit">Cadastrar</button>
    </form>
    <div class="sg-login">Já tem uma conta? <button type="button" id="sglogin">Entrar</button></div>
    <div class="sg-notice">Demonstração visual: esta versão não cria contas reais nem envia ou salva senhas. Use apenas dados fictícios para testar.</div>
    <p class="sg-legal">Ao cont
